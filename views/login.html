<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TimeToCube - Login</title>
		<link rel="stylesheet" href="../public/styles/main.css" />
		<link rel="stylesheet" href="../public/styles/login.css" />

		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
			integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
	</head>
	<body>
		<div id="navbar">
			<a class="nav-logo" href="/index.html">TimeToCube</a>
			<div class="nav-links">
				<a href="#" class="nav-link">about</a>
				<a href="signup.html" class="nav-link">Sign Up</a>
			</div>
		</div>
		<form id="log-in">
			<h1>Log In</h1>
			<p class="error"></p>
			<label for="email">Correo</label>
			<input type="email" name="email" id="email" required />

			<label for="password">Contraseña</label>
			<input type="password" name="password" id="password" required />

			<button class="btn-primary" id="submit">
				Ingresar <i class="fa-solid fa-arrow-right"></i>
			</button>
		</form>
		<script src="/public/scripts/auth/login.js" type="module"></script>
	</body>
</html>
